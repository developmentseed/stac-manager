server {
    listen 8080;
    root /app/packages/client/dist;

    # The entrypoint rewrites files at startup without renaming them, so keep this short.
    add_header Cache-Control "max-age=3600";

    # Paths that are not files get the app, so client-side routes load.
    location / {
        try_files $uri /index.html;
    }

    # A path with a file extension is a file, so a missing one is a 404, not the app.
    # Paths under /collections/ stay routes because collection and item IDs can contain dots.
    location ~ ^/(?!collections/).+\.[^/]+$ {
        try_files $uri =404;
    }
}
